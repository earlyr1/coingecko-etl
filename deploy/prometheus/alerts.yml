# Alert rules from spec §8.4. Label values follow the services' metrics:
# etl_schema_validations_total{result} is "pass" or "fail" in every stage, and
# schema is the schema file name without .json (coins_markets.v1, coin.v1, ...).
# Every service registers the whole etl_* catalogue, so rules about one
# service's metric select it by job (the job names of prometheus.yml).
groups:
  - name: etl
    rules:
      - alert: ETLDataStale
        # No successful CoinGecko call for more than 2 minutes on an endpoint
        # that has succeeded before, or no successful markets call at all yet.
        expr: |
          time() - max by (endpoint) (etl_last_success_timestamp_seconds) > 120
          or
          absent(etl_last_success_timestamp_seconds{endpoint="coins_markets"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No successful CoinGecko poll for {{ $labels.endpoint }} in over 2 minutes"
          description: "Check the fetcher logs (logs/fetcher/etl.log) for HTTP errors or a 429 cooldown."

      - alert: ETLDeadLetterRecords
        # increase() misses the first sample of a brand-new series, so new
        # series (absent 10 minutes ago) are caught by the second branch.
        expr: |
          sum by (stage, error_class) (increase(etl_dlq_total[10m])) > 0
          or
          sum by (stage, error_class) (etl_dlq_total unless etl_dlq_total offset 10m) > 0
        labels:
          severity: warning
        annotations:
          summary: "Records went to the dead-letter zone ({{ $labels.stage }} / {{ $labels.error_class }})"
          description: "Inspect data/dlq/; a human is needed."

      - alert: ETLSourceSchemaDrift
        # More than 5% of CoinGecko responses fail the source schema (S0) in 15 minutes.
        expr: |
          sum(rate(etl_schema_validations_total{schema=~"coins_markets.v1|coin.v1", result="fail"}[15m]))
          /
          sum(rate(etl_schema_validations_total{schema=~"coins_markets.v1|coin.v1"}[15m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of CoinGecko responses fail the source schema (upstream format change?)"
          description: "See data/dlq/stage=transform/ for source_schema_violation records."

      - alert: ETLExportLagHigh
        # Only the exporter moves etl_export_lag_seconds; the other services
        # export a constant 0, which must not hide a missing exporter.
        expr: |
          max(etl_export_lag_seconds{job="exporter"}) > 300
          or
          absent(etl_export_lag_seconds{job="exporter"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ if $labels.job }}The exporter reports no export lag{{ else }}Exporter is {{ $value | humanizeDuration }} behind raw.api_calls{{ end }}"
          description: "A long Postgres transaction stalls the xid8 cursor, S3 is failing, or the exporter is down."

      - alert: ETLConsumerLagGrowing
        # Total lag has been rising for 10 minutes and is not trivially small.
        expr: |
          deriv(sum(etl_consumer_lag_records)[10m:1m]) > 0
          and
          sum(etl_consumer_lag_records) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transformer consumer lag has grown for 10 minutes"
          description: "Transformers are slower than the publisher, a batch keeps failing, or a partition is halted (see ETLObjectChecksumMismatch)."

      - alert: ETLServiceDown
        # Prometheus finds the containers through Docker DNS: a stopped or
        # crash-looping container has no target at all (absent), a hung one
        # fails its scrape (up == 0).
        expr: |
          up{job=~"fetcher|exporter|publisher|transformer"} == 0
          or absent(up{job="fetcher"})
          or absent(up{job="exporter"})
          or absent(up{job="publisher"})
          or absent(up{job="transformer"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down{{ if $labels.instance }} ({{ $labels.instance }}){{ end }}"
          description: "Prometheus cannot scrape it, or Docker DNS knows no running container for it. Check docker compose ps and its log."

      - alert: ETLPipelineNotProgressing
        # CoinGecko calls succeed but no transformer counted a record (written,
        # duplicate, rejected or dlq) in 15 minutes. "or vector(0)": a
        # transformer that never wrote a batch has no etl_records_total series.
        expr: |
          sum(increase(etl_api_requests_total{status="200"}[15m])) > 0
          and
          (sum(increase(etl_records_total[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CoinGecko calls succeed but nothing reached the lake in 15 minutes"
          description: "The exporter, the publisher (or the broker) or the transformers are stalled; check their logs and ETLServiceDown."

      - alert: ETLObjectChecksumMismatch
        # A write-once key already holds other bytes (PUT 412 with another
        # sha256), or a re-planned transformer batch differs from its manifest.
        # The exporter, publisher and transformer count it. The transformer
        # halts the affected partition and keeps running, so the counter, and
        # this alert, stay up until a human resolves the conflict and restarts it.
        expr: sum by (job) (etl_s3_put_total{result="mismatch"}) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: an object key already holds different bytes"
          description: "The write-once check failed; see the ERROR log of {{ $labels.job }}. A halted transformer partition stays stopped until the conflict is resolved and the transformer restarted."

      - alert: ETLFrequentRateLimiting
        expr: sum(increase(etl_api_rate_limited_total[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "CoinGecko returned HTTP 429 {{ $value }} times in 15 minutes"
          description: "Lower the request rate or set COINGECKO_API_KEY."
