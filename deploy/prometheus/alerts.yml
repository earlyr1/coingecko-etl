# Alert rules from spec §8.4. Label values follow the services' metrics:
# etl_schema_validations_total{result} is "pass" or "fail" in every stage, and
# schema is the schema file name without .json (coins_markets.v1, coin.v1, ...).
# Every long-running service registers the whole etl_* catalogue, so rules
# about one service's metric select it by job (the job names of
# prometheus.yml). The batch jobs push etl_job_* and etl_publish_* /
# etl_retention_* gauges to the Pushgateway under job="etl_publisher",
# "etl_retention" and "etl_vacuum" (scraped with honor_labels).
groups:
  - name: etl
    rules:
      - alert: ETLDataStale
        # No successful CoinGecko call for more than 2 minutes on an endpoint
        # that has succeeded before, or no successful markets call at all yet.
        expr: |
          time() - max by (endpoint) (etl_last_success_timestamp_seconds) > 120
          or
          absent(etl_last_success_timestamp_seconds{endpoint="coins_markets"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No successful CoinGecko poll for {{ $labels.endpoint }} in over 2 minutes"
          description: "Check the fetcher logs (logs/fetcher/etl.log) for HTTP errors or a 429 cooldown."

      - alert: ETLDeadLetterRecords
        # increase() misses the first sample of a brand-new series, so new
        # series (absent 10 minutes ago) are caught by the second branch. The
        # publisher is a batch job: its last successful run's DLQ line count is
        # a pushed gauge, which stays up until the next successful run pushes 0.
        expr: |
          sum by (stage, error_class) (increase(etl_dlq_total[10m])) > 0
          or
          sum by (stage, error_class) (etl_dlq_total unless etl_dlq_total offset 10m) > 0
          or
          label_replace(
            label_replace(max(etl_publish_dlq_lines{job="etl_publisher"}) > 0, "stage", "publish", "", ""),
            "error_class", "see the window's DLQ object", "", "")
        labels:
          severity: warning
        annotations:
          summary: "Records went to the dead-letter zone ({{ $labels.stage }} / {{ $labels.error_class }})"
          description: "Inspect data/dlq/; a human is needed."

      - alert: ETLSourceSchemaDrift
        # More than 5% of CoinGecko responses fail the source schema (S0) in 15 minutes.
        expr: |
          sum(rate(etl_schema_validations_total{schema=~"coins_markets.v1|coin.v1", result="fail"}[15m]))
          /
          sum(rate(etl_schema_validations_total{schema=~"coins_markets.v1|coin.v1"}[15m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of CoinGecko responses fail the source schema (upstream format change?)"
          description: "See data/dlq/stage=transform/ for source_schema_violation records."

      - alert: ETLExportLagHigh
        # etl_export_lag_seconds is the time past the end of the oldest raw
        # window the exporter has not closed yet (0 on schedule). Only the
        # exporter moves it; the other services export a constant 0, which
        # must not hide a missing exporter.
        expr: |
          max(etl_export_lag_seconds{job="exporter"}) > 300
          or
          absent(etl_export_lag_seconds{job="exporter"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ if $labels.job }}The exporter reports no export lag{{ else }}Exporter is {{ $value | humanizeDuration }} behind closing raw windows{{ end }}"
          description: "A raw window cannot close: S3 is failing, a claimed part keeps failing (checksum or row-count mismatch), Postgres is unreachable, or the exporter is down."

      - alert: ETLConsumerLagGrowing
        # Total lag has been rising for 10 minutes and is not trivially small.
        expr: |
          deriv(sum(etl_consumer_lag_records)[10m:1m]) > 0
          and
          sum(etl_consumer_lag_records) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transformer consumer lag has grown for 10 minutes"
          description: "Transformers are slower than the publisher, a batch keeps failing, or a partition is halted (see ETLObjectChecksumMismatch)."

      - alert: ETLServiceDown
        # Prometheus finds the containers through Docker DNS: a stopped or
        # crash-looping container has no target at all (absent), a hung one
        # fails its scrape (up == 0). The publisher is a batch job (etl
        # publish), not a service: ETLPublisherStale covers it.
        expr: |
          up{job=~"fetcher|exporter|transformer"} == 0
          or absent(up{job="fetcher"})
          or absent(up{job="exporter"})
          or absent(up{job="transformer"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down{{ if $labels.instance }} ({{ $labels.instance }}){{ end }}"
          description: "Prometheus cannot scrape it, or Docker DNS knows no running container for it. Check docker compose ps and its log."

      - alert: ETLPipelineNotProgressing
        # CoinGecko calls succeed but no transformer counted a record (written,
        # duplicate, rejected or dlq) in 15 minutes. "or vector(0)": a
        # transformer that never wrote a batch has no etl_records_total series.
        expr: |
          sum(increase(etl_api_requests_total{status="200"}[15m])) > 0
          and
          (sum(increase(etl_records_total[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CoinGecko calls succeed but nothing reached the lake in 15 minutes"
          description: "The exporter, the publisher (Cronicle job etl-publish), the broker or the transformers are stalled; check their logs, ETLServiceDown and ETLPublisherStale."

      - alert: ETLObjectChecksumMismatch
        # A write-once key already holds other bytes (PUT 412 with another
        # sha256), or a re-planned transformer batch differs from its manifest.
        # The exporter and the transformer count it; the publisher (a batch
        # job) exits non-zero on a raw part mismatch instead, which
        # ETLPublisherStale catches. The transformer halts the affected
        # partition and keeps running, so the counter, and this alert, stay up
        # until a human resolves the conflict and restarts it.
        expr: sum by (job) (etl_s3_put_total{result="mismatch"}) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: an object key already holds different bytes"
          description: "The write-once check failed; see the ERROR log of {{ $labels.job }}. A halted transformer partition stays stopped until the conflict is resolved and the transformer restarted."

      - alert: ETLFrequentRateLimiting
        expr: sum(increase(etl_api_rate_limited_total[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "CoinGecko returned HTTP 429 {{ $value }} times in 15 minutes"
          description: "Lower the request rate or set COINGECKO_API_KEY."

      - alert: ETLMaintenanceStale
        # Retention and VACUUM run daily (Cronicle events etl-retention and
        # etl-vacuum). Fires only for a job that has succeeded before; a job that
        # never succeeded is ETLMaintenanceNeverSucceeded.
        expr: |
          time() - max by (job) (etl_job_last_success_timestamp_seconds{job=~"etl_retention|etl_vacuum"}) > 26 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has not succeeded for over 26 hours"
          description: "Check its Cronicle event (etl-retention or etl-vacuum) and logs/maintenance/etl.log."

      - alert: ETLMaintenanceNeverSucceeded
        # A fresh stack runs maintenance at 11:00/11:30 only: absent for 26 hours
        # means it never succeeded.
        expr: |
          absent(etl_job_last_success_timestamp_seconds{job="etl_retention"})
          or
          absent(etl_job_last_success_timestamp_seconds{job="etl_vacuum"})
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has never succeeded"
          description: "Check its Cronicle event (etl-retention or etl-vacuum) and logs/maintenance/etl.log."

      - alert: ETLPublisherStale
        # The publisher runs every ETL_WINDOW (5m) and pushes its last success
        # time. 15 minutes without one is three windows in a row. The second
        # branch covers a stack where no publish ever succeeded; it waits until
        # Prometheus has been up for 15 minutes (startup grace; `for` would also
        # delay the first branch). Pushgateway persistence keeps the series
        # across restarts.
        expr: |
          time() - max(etl_job_last_success_timestamp_seconds{job="etl_publisher"}) > 900
          or
          (
            absent(etl_job_last_success_timestamp_seconds{job="etl_publisher"})
            and on() (time() - max(process_start_time_seconds{job="prometheus"}) > 900)
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No successful etl publish in over 15 minutes"
          description: "Check the etl-publish job in Cronicle (red runs, their logs) and logs/publisher/etl.log; a missing raw _SUCCESS means the exporter is behind."
